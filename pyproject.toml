[tool.poetry]
name = "mesh-calculator"
version = "0.1.0"
description = "Mesh network tower placement optimizer with hierarchical site connectivity"
authors = ["Mesh Calculator Team"]
packages = [{include = "mesh_calculator"}]

[tool.poetry.scripts]
mesh-calculator = "mesh_calculator.cli.main:main"
mesh-calculator-routes = "mesh_calculator.cli.routes:routes_cmd"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
h3 = ">=4.0.0"
shapely = ">=2.0.0"
pyproj = ">=3.6.0"
rasterio = ">=1.3.0"
fiona = ">=1.9.0"
geopandas = ">=0.14.0"
numpy = ">=1.24.0"
scipy = ">=1.11.0"
pandas = ">=2.0.0"
networkx = ">=3.0"
rtree = ">=1.0.0"
click = ">=8.1.0"
pyyaml = ">=6.0"
structlog = ">=24.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-cov = ">=4.0"

[tool.poetry.group.viz.dependencies]
folium = ">=0.15.0"
matplotlib = ">=3.8.0"

[tool.pytest.ini_options]
testpaths = ["mesh_calculator/tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
