[project]
name = "mesh-calculator"
version = "0.1.0"
description = "Mesh network tower placement optimizer with hierarchical site connectivity"
readme = "README.md"
requires-python = ">=3.10,<4.0"
authors = [{ name = "Mesh Calculator Team" }]
dependencies = [
  "h3>=4.0.0",
  "shapely>=2.0.0",
  "pyproj>=3.6.0",
  "rasterio>=1.3.0",
  "fiona>=1.9.0",
  "geopandas>=0.14.0",
  "numpy>=1.24.0",
  "scipy>=1.11.0",
  "pandas>=2.0.0",
  "networkx>=3.0",
  "rtree>=1.0.0",
  "click>=8.1.0",
  "pyyaml>=6.0",
  "structlog>=24.0.0",
]

[project.scripts]
mesh-calculator = "mesh_calculator.cli.main:main"
mesh-calculator-routes = "mesh_calculator.cli.routes:routes_cmd"

[dependency-groups]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
]
viz = [
  "folium>=0.15.0",
  "matplotlib>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["mesh_calculator/tests"]

[tool.hatch.build.targets.wheel]
packages = ["mesh_calculator"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"
